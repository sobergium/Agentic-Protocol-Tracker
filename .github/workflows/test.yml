name: test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x402-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m x402_sandbox.demo --flow authorization
      - run: python -m x402_sandbox.demo --flow upfront
      - run: python -m x402_sandbox.demo --flow escrow

  release-x402:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Package x402 sandbox release'
    needs: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: git archive --format=zip --output=x402-paid-api-sandbox-v0.1.0.zip HEAD:x402-sandbox
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create x402-sandbox-v0.1.0
          x402-paid-api-sandbox-v0.1.0.zip
          --target "$GITHUB_SHA"
          --title "x402 Paid-API Sandbox v0.1.0"
          --notes-file RELEASE_NOTES.md

  release-interface:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Package portfolio interface release'
    needs: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build interface archive
        run: git archive --format=zip --output=portfolio-interface-v0.1.0.zip HEAD:site
      - name: Publish tagged interface release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create portfolio-interface-v0.1.0
          portfolio-interface-v0.1.0.zip
          --target "$GITHUB_SHA"
          --title "Systems Over Signals — Portfolio Interface v0.1.0"
          --notes "Responsive, dependency-free presentation layer with interactive payment-flow states, failure injection, evidence viewer and atomicity comparison. Built around the Systems Over Signals ivory, ink and teal identity."
