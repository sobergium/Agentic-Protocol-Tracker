name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x402-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m x402_sandbox.demo --flow authorization
      - run: python -m x402_sandbox.demo --flow upfront
      - run: python -m x402_sandbox.demo --flow escrow
